  /* ----- screens 15 / 16 ----- */
  viewBA(V, s) {
    const reference = this.learningReferenceScene();
    const st = this.state, F = this.fig('pentagon'), K = this.k('pentagon');
    const orig = F.pts, user = st.userPts || F.pts;
    const compare = this.compareFocus();
    const C = compare ? this.compareLayout().cards : null;
    const size = compare ? C.size : reference ? 440 : 380, gapX = 110;
    const y = compare ? C.y : reference ? 300 : 40;
    /* While she is comparing them the two pentagons sit out at the edges, with
       her between; otherwise keep the pair balanced with room for Check. */
    const leftX = compare ? C.leftX : reference ? 750 : SAFE.w / 2 - gapX - size;
    const rightX = compare ? C.rightX : reference ? 1290 : SAFE.w / 2 + gapX;
    const segsO = this.segs('pentagon'), segsU = this.segs('pentagon', user);
    const pad = 36, vb = F.vb.split(' ').map(Number);
    const shapeScale = Math.min((size - 2 * pad - 10) / vb[2], (size - 2 * pad - 10) / vb[3]);
    /* Screen 31: the stepper and the After figure are the same fact shown two
       ways. Whatever number the learner has dialled is the number of sides lit
       and numbered on the shape, so "3" and three sides are never out of step. */
    const counting = s.q === 'count2';
    const mk = (which) => {
      const pts = which ? user : orig, segs = which ? segsU : segsO;
      const dialled = Math.max(0, Math.min(st.cnt[1] || 0, segs.length));
      const n = which ? (counting ? dialled : (st.numsB || 0)) : (st.nums || 0);
      const nums = [];
      // Use the edge's outward normal, not the centre of a potentially concave shape.
      const winding = Math.sign(pts.reduce((area, a, i) => {
        const b = pts[(i + 1) % pts.length];
        return area + a[0] * b[1] - b[0] * a[1];
      }, 0)) || 1;
      const pin = (i, label) => {
        const edge = segs[i], m = edge.mid, u = this.unit(edge.a, edge.b), offset = 24 / shapeScale;
        nums.push({ x: m[0] + winding * u[1] * offset, y: m[1] - winding * u[0] * offset,
          fs: 30 / shapeScale, t: String(label) });
      };
      /* The counted sides are shown by the highlight alone. Numbering them as
         well says the same thing twice -- and the number the learner is being
         asked for is already sitting in the stepper below, so printing it on
         the figure hands back the answer they are meant to be working out.
         Every other screen that numbers its sides is unaffected. */
      if (!(which && counting)) for (let i = 0; i < Math.min(n, segs.length); i++) pin(i, i + 1);
      /* The sides the learner has counted so far, lit in the figure's own
         colour. The newest one draws itself on rather than appearing, so a tap
         on + reads as "and this one too" instead of a silent jump. */
      const counted = which && counting && n > 0
        ? this.segHl('pentagon', Array.from({ length: n }, (unused, i) => i), pts, ICE, 26)
            .map((seg, i) => Object.assign(seg, { style: Object.assign(
              { filter: 'drop-shadow(0 0 10px rgba(34,184,230,.7))' },
              i === n - 1 && !this.reducedMotion()
                ? { strokeDasharray: 100, strokeDashoffset: 100, animation: 'dr 340ms ease-out both' }
                : {}) }))
        : [];
      /* While she is comparing them, both outlines breathe — left first, then
         right — so "both" is something the learner sees, not only hears. */
      const glow = st.phase === 'b'
        ? [{ d: this.dPath(pts, true), color: which ? this.tint(this.P.C.orange, .55) : 'rgba(34,184,230,0.55)', w: 34 * K, style: { animation: reference ? 'glowPulse 1.4s ease-in-out 2' : 'glowPulse 1.4s ease-in-out infinite' } }]
        : compare && !(which && counting)
          ? [{ d: this.dPath(pts, true), color: which ? 'rgba(244,151,45,.5)' : 'rgba(34,184,230,.5)', w: 30 * K,
              style: this.reducedMotion() ? { opacity: 0.3 }
                : { animation: 'glowPulse 1.6s ease-in-out ' + (which ? 820 : 0) + 'ms 3' } }]
          : [];
      const card = this.buildCard({
        key: which ? 'after' : 'before', x: which ? rightX : leftX, y: y, w: size, h: size,
        vb: F.vb, pad: pad, numberInset: 5, d: this.dPath(pts, true), stroke: which ? this.P.C.orange : this.P.C.blue, sw: 18,
        fill: this.tint(which ? this.P.C.orange : this.P.C.blue),
        hl: counted.concat(glow, which && counting && st.count2Pulsing && !this.reducedMotion()
          ? [{d:this.dPath(pts,true),color:ICE,w:34*K,
              style:{animation:'polygonRevealGlow 700ms ease-in-out 340ms 1 both'}}] : []), nums: nums,
        numColor: which ? '#8a4a08' : '#1546a0',
        /* No Before/After captions. The two figures are already told apart by
           colour and by position, and only one of them has a stepper under it,
           so the captions labelled what the layout had already said. */
        badge: '', chip: '',
        chipBg: which ? '#fff0dc' : '#e8f4ff', chipBorder: which ? '#f6ba72' : '#9fd8f4', chipColor: which ? '#965113' : '#2c6ba8',
        snap: reference,
        anim: !reference && st.phase === 'a' ? 'pop 1200ms ease-in-out 2' : 'none'
      });
      if (reference) Object.assign(card.wrap,{borderColor:which?'#f6ba72':'#9fd8f4',boxShadow:'inset 0 2px 0 #fff,0 7px 0 '+(which?'#e0b57c66':'#72bbdd66')});
      return card;
    };
    V.cards = [mk(false), mk(true)];
    if (s.q === 'count2') {
      V.showCheck = false;
      V.checkStyle = {display:'none'};
      V.check = null;
      V.showCounter = true;
      V.counterRowStyle = {position:'absolute',inset:0,pointerEvents:'none'};
      const counter = this.counter(1, '');
      Object.assign(counter,{min:0,max:5,fixed:!!st.count2Complete});
      counter.nudge = '1';
      counter.accessibleLabel = 'Number of sides after';
      Object.assign(counter.wrap, {position:'absolute',left:(rightX+size/2)+'px',top:(y+size+64)+'px',translate:'-50% 0',pointerEvents:'auto'});
      V.counters = [counter];
      const checkOffset = (-parseFloat(this.counterCheckStyle().width) / 2) + 'px';
      V.counterCheckPosition = {position:'absolute',left:(rightX+size/2)+'px',top:(y+size+180)+'px',marginLeft:checkOffset,pointerEvents:'auto'};
      if (reference) {
        V.counterRowStyle = {position:'absolute',left:(rightX+size/2)+'px',top:'790px',width:'max-content',translate:'-50% 0',display:'flex',alignItems:'center'};
        Object.assign(counter.wrap,{position:'relative',left:'auto',top:'auto',translate:'none'});
        /* The stepper stays centred on the figure it counts. On the comparison
           run the two cards open out to the board's edges, which leaves no room
           for Check beside it -- the button ran off the board. It sits under
           the stepper there instead, still centred on the same figure. */
        V.counterCheckPosition = compare
          ? {position:'absolute',left:'50%',top:'calc(100% + 16px)',marginLeft:checkOffset,pointerEvents:'auto'}
          : {position:'absolute',left:'calc(100% + 24px)',top:'calc(50% - 38px)',pointerEvents:'auto'};
        const known = this.labelPill('5 sides',790);

        V.callouts = [known];
      }
    }
  }

  /* ----- naming screens ----- */
  viewName(V, s) {
    const reference = this.learningReferenceScene();
    /* The named shape is the whole point of these screens, so it takes as much
       of the right lane as the name pill beneath it will allow. */
    const st = this.state, F = this.fig(s.fig), size = reference ? 730 : 440, K = this.k(s.fig);
    /* The figure's box stops short of the label band, so a wide shape cannot
       grow down into its own name. An octagon fills far more of a square box
       than a triangle does, and sizing both to the full height put the heptagon
       and octagon labels on top of the shape and over the board's bottom edge. */
    const nameBox = { x: 925, y: NAME_FIGURE.y, w: size, h: NAME_FIGURE.h };
    const pts = st.morph || F.pts;
    const segs = this.segs(s.fig, st.morph ? null : F.pts), c = this.centroid(F.pts);
    const nums = [];
    if (!st.morph) {
      for (let i = 0; i < st.nums; i++) {
        const m = segs[i].mid, u = this.unit(c, m), o = 60 * K;
        nums.push({ x: +(m[0] + u[0] * o).toFixed(1), y: +(m[1] + u[1] * o).toFixed(1), ty: +(m[1] + u[1] * o + 15 * K).toFixed(1), r: 38 * K, sw: 8 * K, fs: 46 * K, t: String(i + 1) });
      }
    }

       found it. The numbers stay -- they are the count being taught; the
       highlight was only ever pointing at which side was being counted. */
    const hl = !st.morph && st.nums > 0 && !st.sideWalkDone
      ? this.segHl(s.fig, [st.nums - 1], null, ICE, 26) : [];
    V.cards = [this.buildCard({
      key: s.fig, x: reference ? nameBox.x : (SAFE.w - size) / 2, y: reference ? nameBox.y : 40,
      w: size, h: reference ? nameBox.h : size, plain: true, snap: reference,
      vb: F.vb, d: this.dPath(pts, true), stroke: this.polyColor(s.fig), sw: 18,
      fill: this.tint(this.polyColor(s.fig)), hl: hl, nums: nums
    })];
    if (st.reveal || st.nums >= (s.count || 99)) {
      /* Anchor the name below whatever actually reaches lowest — the silhouette
         or the side number hanging under its bottom edge. Measuring the shape
         alone left the label pressed against that number. */
      const lowestInk = Math.max(...F.pts.map(p => p[1]),
        ...nums.map(n => n.y + n.r));
      const bottom = this.mapPt(nameBox,F.vb,[F.pts[0][0],lowestInk])[1];
      const pill = this.labelPill(s.reveal,reference ? bottom + NAME_LABEL_GAP : 540);
      if (reference) pill.style.left = (nameBox.x + size / 2) + 'px';
      V.callouts = [pill];
    }
  }

  /* ----- recall ----- */

  /* ----- multi select ----- */
  viewMulti(V, s) {
    const st = this.state, S = this.sets()[s.set];
    /* Four options as a 2 x 2 beside Swiftee — screen 19's composition, reused
       for screen 36 because it asks the same kind of question. */
    const discovery = ['S10','S18','C1','C4'].includes(s.sc);
    const baseGrid = discovery ? this.polygonIntroLayout().grid : null;
    /* Screen 45 uses screen 44's grid exactly -- same tiles, same positions.
       The two screens ask the same kind of question, and a figure that moves
       or shrinks between them reads as a different, lesser thing. */
    const pentagonChoice = s.sc === 'C4';
    const grid = baseGrid;
    const n = S.length;
    const w = n >= 6 ? 236 : (n === 5 ? 272 : 300), gap = n >= 6 ? 26 : 38;
    const total = n * w + (n - 1) * gap;
    const x0 = (SAFE.w - total) / 2, y = 130;
    const done = s.correct.every((c) => st.sel.indexOf(c) >= 0) && st.sel.length === s.correct.length;
    V.cards = S.map((it, i) => {
      const F = this.fig(it[0]);
      const sel = st.sel.indexOf(i) >= 0;
      const rejected = s.sc === 'S10' && (st.rejectedOptions || []).includes(i);
      const figureColor = rejected ? '#7fb2d9' : it[1];
      let state = null;
      if (st.wrong === i || (st.wrong === 'set' && sel && !s.correct.includes(i))) state = 'bad';
      else if (sel && !s.check) state = 'ok';
      else if (sel && s.check) state = st.checked || (pentagonChoice && s.correct.includes(i)) ? 'ok' : 'sel';
      // Screen 45 is a selection activity: preserve the artwork and reserve
      // the green underglow for correct choices; never add a yellow trace.
      const selectionTint = pentagonChoice && state === 'sel'
          ? Object.assign({}, this.cardStyleFor(null), {borderColor:ICE}) : undefined;
      const coach = !pentagonChoice && st.hlKind === 'coach' && sel && s.correct.indexOf(i) < 0;
      const tileSize = discovery ? grid.tile : w;
      /* Four options as a square block in the right lane, beside Swiftee. A
         2 x 2 reads as one group at a glance; the 3 + 2 it replaced left a
         short second row that looked like an afterthought. */
      const tileX = pentagonChoice ? grid.x+(i%2)*(grid.tile+grid.gap) : discovery ? grid.x + (i % 2) * (grid.tile + grid.gap) : x0 + i * (w + gap);
      const tileY = discovery ? grid.y + Math.floor(i / 2) * (grid.tile + grid.gap) : y;
      const card = this.buildCard({
        key: it[0], x: tileX, y: tileY, w: tileSize, h: tileSize, vb: F.vb, d: this.figD(it[0]),
        extra: F.extra || '', stroke: figureColor, sw: 20, fill: this.figFill(it[0], figureColor, rejected ? undefined : it[2]), state: state, tint: selectionTint,
        badge: discovery ? '' : String.fromCharCode(65 + i), click: rejected ? null : this.tapCard(i), tick: discovery && sel && (!s.check || st.checked),
        nudge: !st.checked && i === s.correct.find(index => !st.sel.includes(index)),
        traceD: F.traceD || this.figD(it[0]), traceStyle: coach ? this.traceStyleFor(true, 1500) : { opacity: 0 },
        anim: state === 'bad' ? ((s.set === 'cfu1' || s.sc === 'S18' ? (this._wrongTapToken % 2 ? 'wrongTapA' : 'wrongTapB') : 'wig') + ' 420ms ease-in-out both') : (coach ? 'pop 900ms ease-in-out infinite' : 'none')
      });
      if (rejected) {
        card.disabled = true;
        Object.assign(card.wrap, {cursor:'default',pointerEvents:'none',transform:'none',animation:'none'});
      }
      if (s.sc === 'S10') card.pathStyle = Object.assign({},card.pathStyle,{
        transition:this.reducedMotion() ? 'none' : 'stroke 360ms ease, fill 360ms ease'
      });
      if (s.sc === 'S18' && (state === 'ok' || state === 'bad')) {
        const correct = state === 'ok', rim = correct ? CORRECT_RIM : INCORRECT_RIM;
        // A solid inner rim and tinted face remain clear even on a small screen.
        // Keep the artwork, dimensions and keyboard focus treatment intact.
        Object.assign(card.wrap, {
          ...this.cardStyleFor(state),
          zIndex: 3
        });
      }
      if (discovery) {
        card.wrap.borderRadius = '28px';
        // Keep selected checks inside the card, clear of adjacent figures.
        Object.assign(card.markStyle, {right:'12px',top:'12px',width:'42px',height:'42px',fontSize:'26px'});
      }
      return card;
    });
    if (s.check) {
      V.showCheck = !st.checked;
      V.checkDisabled = this.locked() || (!st.checked && !st.sel.length);
      if (V.checkDisabled) V.check = null;
      V.nudgeCheck = st.checked || done ? '1' : '';
      V.checkLabel = 'Check';
      V.checkStyle = this.bigBtn(250);

      if (V.checkDisabled) Object.assign(V.checkStyle, {cursor:'default',transform:'none'});
    }
  }

  /* ----- sort ----- */
  viewSort(V, s) {
    const SORT = this.sortLayout();
    const st = this.state, S = this.sets()[s.set];
    const limited = this.sortLimitReached();
    /* Category colours belong to the columns. Placed tiles retain their
       original artwork and surface, with only the shared success glow. */
    const ZONE = [
      { edge: '#20aaa5', bg: '#ddf8ef', hot: '#b5eede', slot: '#1fa49b', wash: 'rgba(31,164,155,0.14)' },
      { edge: '#9463d0', bg: '#efe2ff', hot: '#e0c5ff', slot: '#9463d0', wash: 'rgba(148,99,208,0.14)' }
    ];
    const zoneW = this.sortZoneW();
    const holding = !limited && st.pickedFig !== null && st.pickedFig !== undefined;
    /* One hovered column, whether it came from a drag (sortHover) or from
       tap-then-hover (hoverK). Off-column and not-hovering are both -1. */
    const hoverZone = !holding ? -1
      : (st.sortHover === 0 || st.sortHover === 1 ? st.sortHover
        : (st.hoverK === 'tg0' ? 0 : st.hoverK === 'tg1' ? 1 : -1));
    V.showZones = true;
    V.zoneRowStyle = {
      position: 'absolute', left: this.sortBandX() + 'px', top: SORT.zoneTop + 'px',
      width: (2 * zoneW + this.sortGap()) + 'px',
      display: 'flex', gap: this.sortGap() + 'px',
      transition: this.reducedMotion() ? 'none' : ['left','top','width','gap'].map(property => property+' '+SORT.uniteMs+'ms cubic-bezier(.22,.8,.25,1)').join(', ')
    };
    V.zoneAName = s.zones[0]; V.zoneBName = s.zones[1];
    /* The column headings are button labels like any other, so they take the
       lesson's one label style rather than their own letter-spaced capitals. */
    const zoneTitleStyle = (name, ink) => ({ font: buttonLabelFont(name, zoneW, 48), color: ink, whiteSpace: 'nowrap' });
    V.zoneATitleStyle = zoneTitleStyle(V.zoneAName, '#11645e');
    V.zoneBTitleStyle = zoneTitleStyle(V.zoneBName, '#5f3289');
    const zoneStyle = (which) => {
      const full = this.sortZoneFull(which);
      const hot = hoverZone === which && !full;
      return {
        width: zoneW + 'px', height: SORT.zoneH + 'px', borderRadius: '30px', boxSizing: 'border-box',
        padding: '16px 18px',
        border: '5px solid ' + ZONE[which].edge,
        background: hot ? ZONE[which].hot : ZONE[which].bg,
        cursor: holding ? 'pointer' : 'default',
        transform: hot ? 'scale(1.015)' : 'scale(1)',
        /* Both sorting screens keep clean container edges in every state.
           Success glow belongs to the correctly placed tiles. */
        boxShadow: 'none',
        animation: 'none',
        transition: 'width ' + SORT.uniteMs + 'ms cubic-bezier(.22,.9,.24,1), box-shadow 420ms ease-out, border-color 200ms ease-out, background 200ms ease-out, transform 200ms ease-out', textAlign: 'center'
      };
    };
    V.zoneAStyle = zoneStyle(0); V.zoneBStyle = zoneStyle(1);
    /* While a column is hovered, lay the row out as if the held figure were
       already in it: the tiles slide apart and an empty slot opens where it
       will land, so the drop is a confirmation rather than a surprise. */
    const preview = hoverZone >= 0 && !this.sortZoneFull(hoverZone) ? Object.assign({}, st.sortAt, { [st.pickedFig]: hoverZone }) : null;
    const places = this.sortPlaces(preview || st.sortAt);
    /* The tray closes its gaps and stays centred as figures leave it. */
    const queue = S.map((_, i) => i).filter((i) => st.sortAt[i] === undefined);
    const trayColumns = queue.length;
    const trayX = (SAFE.w - (trayColumns * SORT.trayW + (trayColumns - 1) * SORT.trayGap)) / 2;
    V.cards = S.map((it, i) => {
      const F = this.fig(it[0]);
      const at = st.sortAt[i];
      const picked = st.pickedFig === i;
      const spot = at === undefined ? null : places[i];
      const size = spot ? spot.w : SORT.trayW;
      const x = spot ? spot.x : trayX + (queue.indexOf(i) % trayColumns) * (SORT.trayW + SORT.trayGap);
      const y = spot ? spot.y : SORT.trayY + Math.floor(queue.indexOf(i) / trayColumns) * (SORT.trayW + SORT.trayGap);
      const card = this.buildCard({
        key: it[0], x: x, y: y, w: size, h: size, vb: F.vb, d: this.figD(it[0]),
        extra: F.extra || '', stroke: it[1], sw: 22, pad: 14, fill: this.figFill(it[0], it[1], it[2]),
        state: at !== undefined ? 'ok' : limited ? null : (st.wrong === i ? 'bad' : (picked ? 'sel' : null)),
        tick: st.tick === i,
        /* Tapping a tile that is already in a column used to hit the tile —
           which has no handler — so the column under it never heard the tap. */
        through: at !== undefined, stillCard: limited,
        click: at === undefined ? this.tapCard(i) : null, down: at === undefined ? this.dragFigure(i) : null,
        opacity:st.draggingFigure === i ? 0.3 : 1,
        nudge: !limited && at === undefined && st.pickedFig === null && i === S.findIndex((_, index) => st.sortAt[index] === undefined),
        z: at === undefined ? 8 : 9,
        /* The ghost already flew this one home — show it there, don't re-run
           the slide. Its neighbours still animate as they make room. */
        snap: st.justPlaced === i,
        anim: st.wrong === i ? ((limited || ['C2','C5'].includes(s.sc) ? (this._sortRejectToken % 2 ? 'wrongTapA' : 'wrongTapB') : 'wig') + ' 420ms ease-in-out both') : (picked && s.sc !== 'C2' ? 'pop 900ms ease-in-out infinite' : 'none')
      });
      if (s.sc === 'C2') {
        const correct = at !== undefined, incorrect = st.wrong === i;
        if (correct || incorrect || picked) {
          const rim = correct ? CORRECT_RIM : incorrect ? INCORRECT_RIM : ICE;
          Object.assign(card.wrap, {
            borderColor:rim,
            background:correct ? CORRECT_FACE : incorrect ? INCORRECT_FACE : '#eaf8ff',
            boxShadow:this.cardStyleFor(correct ? 'ok' : incorrect ? 'bad' : null).boxShadow
          });
        }
      }
      if (st.united && at !== undefined) card.wrap.transition = this.reducedMotion() ? 'none' : ['left','top','width','height'].map(property => property+' '+SORT.uniteMs+'ms cubic-bezier(.22,.8,.25,1)').join(', ');
      if (limited && at === undefined) { card.sortLimitBlocked = true; card.wrap.cursor = 'default'; card.wrap.scale = '1'; }
      return card;
    });
    const target = (zone) => ({
      text: '', click: this.dropInto(zone),
      enter: this.hovOn('tg' + zone), leave: this.hovOff,
      label: s.zones[zone] || '',
      nudge: holding && !this.sortZoneFull(zone) && s.answer[st.pickedFig] === zone ? '1' : '',
      style: {
        position: 'absolute', left: this.sortZoneX(zone) + 'px', top: SORT.zoneTop + 'px',
        width: zoneW + 'px', height: SORT.zoneH + 'px', zIndex: 3,
        cursor: holding ? 'pointer' : 'default'
      }
    });
    V.targets = [target(0), target(1)];
    V.callouts = [];
    if (preview) {
      const slot = places[st.pickedFig];
      V.callouts.push({ text: '', style: {
        position: 'absolute', left: slot.x + 'px', top: slot.y + 'px',
        width: slot.w + 'px', height: slot.w + 'px', boxSizing: 'border-box',
        borderRadius: '30px', border: '4px dashed ' + ZONE[hoverZone].slot,
        background: ZONE[hoverZone].wash,
        zIndex: 2, pointerEvents: 'none',
        transition: 'left 260ms cubic-bezier(.22,.9,.24,1), top 260ms cubic-bezier(.22,.9,.24,1)',
        animation: 'cueFade 180ms ease-out both'
      } });
    }
  }

  restart = () => {
    if (this.locked()) return;
    this._bridging = false;
    this.sfx('tap');
    this._guideGreeted = false;
    this.setState({ k: 0, userPts: null, dragged: false, drawn: false }, () => {
      this.runStep(0, false);
    });
  };
  /* Hand the screen to the runner game (src/runner/runner-stage.js). The lesson's own
     voice stops here and its controls lock; the component stays mounted underneath,
     hidden by the stage, so nothing has to be torn down and RunnerStage.close() could
     give it back. */
  startRunner = () => {
    if (this.locked() || !(window.RunnerStage && window.RunnerStage.enabled)) return;
    this.sfx('tap');
    this.clearNudge();
    if (this._stopRecordedVoice) this._stopRecordedVoice();
    try { window.speechSynthesis.cancel(); } catch (e) {}
    this.setState({ interactive: false });
    window.RunnerStage.start();
  };
  /* PART 1 HANDS OVER TO PART 2 BY A STORY (src/bridge/bridge-story.js), not by a button.
     The completion screen plays as it always has: Swiftee's line, the confetti. When
     that line has been read there is a short pause, and then the story starts by itself:
     the ice frosts over, Momo runs to a broken path, Swiftee flies in and says what is
     next, and her Next brings up the Part 2 cover. The pause is timed from the end of
     the line, so a learner who replays it simply moves the start with it; leaving the
     screen (Back, the screen navigator) clears the timer with every other one. */
  bridgeOn() { return typeof window !== 'undefined' && !!(window.BridgeStory && window.BridgeStory.enabled); }
  queueBridge() {
    if (!this.bridgeOn()) return;
    this.later(() => {
      if (this.step().sc !== 'END' || this._voiceLocked || this.state.speaking) return;
      this.startBridge();
    }, 1400);
  }
  startBridge = () => {
    if (!this.bridgeOn() || this._bridging) return;
    this._bridging = true;
    this.clearNudge();
    if (this._stopRecordedVoice) this._stopRecordedVoice();
    try { window.speechSynthesis.cancel(); } catch (e) {}
    this.setState({ interactive: false });
    window.BridgeStory.start({ audioContext: this.ac() });
  };
  viewEnd(V, s) {
    const row = [['triangle', this.P.C.purple], ['quad', this.P.C.orange], ['pentagon', this.P.C.blue],
      ['hexagon', this.P.C.green], ['heptagon', this.P.C.pink], ['octagon', this.P.C.teal]];
    /* The completion screen shares the teaching composition: Swiftee on the
       left, the six polygons in the right lane as two rows of three. A single
       row of six had to shrink them to fit, and the old right-shifted board
       left her crowded against the first card with her bubble off the screen. */
    const reference = this.learningReferenceScene();
    const lane = 1290, perRow = 3;
    const w = reference ? 250 : 226, gap = reference ? 30 : 24;
    const rowW = perRow * w + (perRow - 1) * gap;
    const x0 = reference ? lane - rowW / 2 : (SAFE.w - row.length * w + gap - (row.length - 1) * gap) / 2;
    V.cards = row.map((it, i) => {
      const F = this.fig(it[0]);
      const col = reference ? i % perRow : i, line = reference ? Math.floor(i / perRow) : 0;
      return this.buildCard({
        key: 'end' + it[0], x: x0 + col * (w + gap), y: (reference ? 140 : 120) + line * (w + 30),
        w: w, h: w, vb: F.vb, snap: reference,
        d: this.figD(it[0]), stroke: it[1], sw: 22, fill: this.tint(it[1]),
        anim: 'pop 2600ms ease-in-out ' + (i * 160) + 'ms infinite'
      });
    });
    V.callouts = [{
      text: 'Polygon: closed + only straight line segments',
      style: {
        position: 'absolute', left: reference ? lane + 'px' : '50%', top: reference ? '700px' : '470px', translate: '-50% 0',
        padding: '16px 54px', borderRadius: '34px', background: '#fff8e2', border: '5px solid ' + GOLD,
        font: '800 42px "Baloo 2", Nunito, sans-serif', color: '#8a5a12', whiteSpace: 'nowrap',
        boxShadow: '0 8px 0 rgba(198,146,44,0.35)', animation: 'pop 620ms ease-out both'
      }
    }];
    /* Two things to do at the end, side by side under the pill. HELP MOMO takes the
       learner on to the Frozen Pass (the runner game, src/runner/runner-stage.js): it is
       where the journey goes next, and the lesson has just given the learner everything
       the game asks for. PLAY AGAIN restarts the lesson. Without the game (?game=0, or a
       page that never loaded the stage) Play again stands alone where it always did. */
    /* With the story into Part 2 there is nothing to press here: the story follows by
       itself (see queueBridge). */
    if (this.bridgeOn()) { V.targets = []; return; }
    const runner = typeof window !== 'undefined' && window.RunnerStage && window.RunnerStage.enabled;
    const y = reference ? '872px' : '620px';
    /* The Part 1 buttons kit's pills (see pillBtn): Help Momo is blue, because it navigates on
       to the game, and Play again gold, because it acts. */
    const button = (text, click, x, nudge, pill) => ({
      text, click, nudge, pill,
      style: Object.assign({ position: 'absolute', left: x, top: y, translate: '-50% 0', zIndex: 8 }, this.pillBtn())
    });
    if (!runner) { V.targets = [button('Play again', this.restart, reference ? lane + 'px' : '50%', '', 'primary')]; return; }
    /* Centred as a pair on the lane; each pill is as wide as its own label makes it, so the
       pair is measured from those widths. */
    const between = 36, wHelp = this.pillWidth('Help Momo'), wAgain = this.pillWidth('Play again');
    const mid = reference ? lane : SAFE.w / 2, half = (wHelp + between + wAgain) / 2;
    V.targets = [
      button('Help Momo', this.startRunner, (mid - half + wHelp / 2) + 'px', '1', 'nav'),
      button('Play again', this.restart, (mid + half - wAgain / 2) + 'px', '', 'primary')
    ];
  }
}

</script>
</body>
